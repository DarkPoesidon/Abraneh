name: Android app
on:
  pull_request:
    paths: ['android/**', 'tests/android/**', 'package.json', '.github/workflows/android.yml']
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_B64: { required: true }
      ANDROID_KEYSTORE_PASSWORD: { required: true }
      ANDROID_KEY_ALIAS: { required: true }
      ANDROID_KEY_PASSWORD: { required: true }
      ANDROID_NEXT_KEYSTORE_B64: { required: true }
      ANDROID_NEXT_KEY_PASSWORD: { required: true }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore the signing keys
        if: startsWith(github.ref, 'refs/tags/installer-v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NEXT_KEYSTORE: ${{ secrets.ANDROID_NEXT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$NEXT_KEYSTORE" || { echo "::error::Missing Android signing keys"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wihm-release.keystore"
          printf '%s' "$NEXT_KEYSTORE" | base64 -d > "$RUNNER_TEMP/wihm-next.keystore"
      - run: chmod +x gradlew
      - name: Test and build the universal APK
        env:
          WIHM_KEYSTORE_FILE: ${{ startsWith(github.ref, 'refs/tags/installer-v') && format('{0}/wihm-release.keystore', runner.temp) || '' }}
          WIHM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WIHM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIHM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --no-daemon
      - name: Sign and verify the release APK
        if: startsWith(github.ref, 'refs/tags/installer-v')
        env:
          WIHM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WIHM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIHM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WIHM_NEXT_KEY_PASSWORD: ${{ secrets.ANDROID_NEXT_KEY_PASSWORD }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          apk=app/build/outputs/apk/release/app-release.apk
          # Android 9 and later follow the signing lineage. Android 5 to 8 need the original key.
          "$apksigner" sign --out "$apk.rotated" --lineage signing-lineage.bin --rotation-min-sdk-version 28 --v4-signing-enabled false \
            --ks "$RUNNER_TEMP/wihm-release.keystore" --ks-key-alias "$WIHM_KEY_ALIAS" --ks-pass env:WIHM_KEYSTORE_PASSWORD --key-pass env:WIHM_KEY_PASSWORD \
            --next-signer --ks "$RUNNER_TEMP/wihm-next.keystore" --ks-key-alias wihm-next --ks-pass env:WIHM_NEXT_KEY_PASSWORD "$apk"
          mv "$apk.rotated" "$apk"
          "$apksigner" verify --print-certs --min-sdk-version 21 --max-sdk-version 27 "$apk" | grep -q 'SHA-256 digest: 04b33140af1dfc333663f19ac5662b9ef2a3147b1105fb243116ff6a243a2c99'
          "$apksigner" verify --print-certs --min-sdk-version 28 "$apk" | grep -q 'SHA-256 digest: 9a2de616d39c69fa2b91be6e74177d28ca73f65d96e227e13451e6610261f549'
      - name: Remove the signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/wihm-release.keystore" "$RUNNER_TEMP/wihm-next.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: sh tests/android/smoke.sh android/app/build/outputs/apk/release/app-release.apk android-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            android-smoke.png
            smoke-logcat.txt
          if-no-files-found: ignore
      - run: cp app/build/outputs/apk/release/app-release.apk wihm-messenger-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/wihm-messenger-android-universal.apk
          if-no-files-found: error
