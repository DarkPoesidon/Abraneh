name: Windows app
on:
  pull_request:
    paths: ['windows/**', 'tests/windows/**', 'tests/windows.test.cjs', 'package.json', 'src/chatRoom.ts', '.github/workflows/windows.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: windows
      - name: Check Windows version matches the server version
        run: node -e "if (require('./windows/package.json').version !== require('./package.json').version) throw Error('Windows and server versions differ')"
      - run: node --test tests/windows.test.cjs
      - name: Open the app against a local server
        shell: bash
        run: |
          npm install --no-save playwright-core
          node tests/windows/e2e.mjs
      - run: npm run dist
        working-directory: windows
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/tags/installer-v1.7.25' && github.event_name != 'pull_request'
        with:
          name: windows-installer
          path: windows/dist/wihm-messenger-windows-setup.exe
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/tags/installer-v1.7.25'
        with:
          path: windows/dist/wihm-messenger-windows-setup.exe
          key: release-${{ github.run_id }}-windows
          enableCrossOsArchive: true
