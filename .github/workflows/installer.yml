name: Installer checks and packages
on:
  push:
    branches: [main]
    tags: ['installer-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:installer
      - run: npm run installer:build
      - name: Build update payload
        if: runner.os == 'Linux'
        env:
          WIHM_UPDATE_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/installer-v') && secrets.WIHM_UPDATE_SIGNING_KEY || '' }}
        run: node scripts/build-update.mjs
      - name: Verify update payload
        if: runner.os == 'Linux'
        run: node scripts/check-update-bundle.mjs
      - run: node scripts/check-installer-assets.mjs
      - run: node scripts/check-installer.mjs
      - name: Check shell launcher
        if: runner.os != 'Windows'
        run: bash -n installer/install.sh installer/Start-Mac.command installer/Start-Linux.sh
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Package installer
        if: runner.os == 'Linux'
        working-directory: dist
        run: |
          zip -qr wihm-installer.zip WIHM-Installer
          tar -czf wihm-installer.tar.gz WIHM-Installer
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/installer-v') && (startsWith(github.ref, 'refs/tags/installer-v') || github.event_name == 'workflow_dispatch')
        with:
          name: wihm-installer
          path: |
            dist/wihm-installer.zip
            dist/wihm-installer.tar.gz
            dist/wihm-update.json
            dist/wihm-update.sig
      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/installer-v')
        with:
          path: |
            dist/wihm-installer.zip
            dist/wihm-installer.tar.gz
            dist/wihm-update.json
            dist/wihm-update.sig
          key: release-${{ github.run_id }}-server
          enableCrossOsArchive: true
  android:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_NEXT_KEYSTORE_B64: ${{ secrets.ANDROID_NEXT_KEYSTORE_B64 }}
      ANDROID_NEXT_KEY_PASSWORD: ${{ secrets.ANDROID_NEXT_KEY_PASSWORD }}
  windows:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    uses: ./.github/workflows/windows.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: [installer, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A signed build attestation lets anyone check that a file came from this repository's workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
        with:
          name: wihm-installer
          path: package
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
        with:
          name: android-apk
          path: package
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
        with:
          name: windows-installer
          path: package
      - uses: actions/cache/restore@v4
        if: startsWith(github.ref, 'refs/tags/installer-v')
        with:
          path: |
            dist/wihm-installer.zip
            dist/wihm-installer.tar.gz
            dist/wihm-update.json
            dist/wihm-update.sig
          key: release-${{ github.run_id }}-server
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: startsWith(github.ref, 'refs/tags/installer-v')
        with:
          path: android/wihm-messenger-android-universal.apk
          key: release-${{ github.run_id }}-android
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: startsWith(github.ref, 'refs/tags/installer-v')
        with:
          path: windows/dist/wihm-messenger-windows-setup.exe
          key: release-${{ github.run_id }}-windows
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Collect cached release packages
        if: startsWith(github.ref, 'refs/tags/installer-v')
        shell: bash
        run: |
          mkdir package
          cp dist/wihm-installer.zip dist/wihm-installer.tar.gz dist/wihm-update.json dist/wihm-update.sig \
            android/wihm-messenger-android-universal.apk windows/dist/wihm-messenger-windows-setup.exe package/
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/installer-v')
        with:
          subject-path: package/*
      - name: Verify and publish the shared release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#installer-v}"
          files="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            printf '## دریافت\n\n'
            printf -- '- **سرور:** [نصب‌کننده](%s/wihm-installer.zip)\n' "$files"
            printf -- '- **اندروید:** [برنامهٔ اندروید](%s/wihm-messenger-android-universal.apk)\n' "$files"
            printf -- '- **ویندوز:** [برنامهٔ ویندوز](%s/wihm-messenger-windows-setup.exe)\n\n---\n\n' "$files"
            cat "docs/releases/$version.fa.md"
          } > notes.md
          (
            cd package
            set -- wihm-installer.zip wihm-installer.tar.gz wihm-update.json wihm-update.sig \
              wihm-messenger-android-universal.apk wihm-messenger-windows-setup.exe
            for asset do test -s "$asset" || exit 1; done
            sha256sum "$@" > SHA256SUMS
            gh release create "$GITHUB_REF_NAME" "$@" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "ابرانه $version" --notes-file ../notes.md
          )
