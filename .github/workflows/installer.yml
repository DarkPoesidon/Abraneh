name: Installer checks and packages
on:
  push:
    branches: [main]
    tags: ['installer-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:installer
      - run: npm run installer:build
      - run: node scripts/check-installer.mjs
      - name: Check shell launcher
        if: runner.os != 'Windows'
        run: bash -n installer/install.sh installer/Start-Mac.command installer/Start-Linux.sh
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Package installer
        if: runner.os == 'Linux'
        working-directory: dist
        run: |
          zip -qr wihm-installer.zip WIHM-Installer
          tar -czf wihm-installer.tar.gz WIHM-Installer
          sha256sum wihm-installer.zip wihm-installer.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: wihm-installer
          path: |
            dist/wihm-installer.zip
            dist/wihm-installer.tar.gz
            dist/SHA256SUMS
  publish:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wihm-installer
          path: package
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" package/* --repo "$GITHUB_REPOSITORY" --title 'WIHM Installer 1.0.0' --notes 'نصب‌کنندهٔ فارسی برای Windows، macOS، Linux و Android/Termux؛ ساخت دیتابیس، تنظیم کلید امنیتی و انتشار خودکار. راهنمای کوتاه: https://github.com/DarkPoesidon/WIHM-Cloudflare/blob/main/docs/EASY-INSTALL.fa.md'
