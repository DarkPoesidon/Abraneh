name: Installer checks and packages
on:
  push:
    branches: [main]
    tags: ['installer-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:installer
      - run: npm run installer:build
      - name: Build update payload
        if: runner.os == 'Linux'
        env:
          WIHM_UPDATE_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/installer-v') && secrets.WIHM_UPDATE_SIGNING_KEY || '' }}
        run: node scripts/build-update.mjs
      - name: Verify update payload
        if: runner.os == 'Linux'
        run: node scripts/check-update-bundle.mjs
      - run: node scripts/check-installer-assets.mjs
      - run: node scripts/check-installer.mjs
      - name: Check shell launcher
        if: runner.os != 'Windows'
        run: bash -n installer/install.sh installer/Start-Mac.command installer/Start-Linux.sh
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Package installer
        if: runner.os == 'Linux'
        working-directory: dist
        run: |
          zip -qr wihm-installer.zip WIHM-Installer
          tar -czf wihm-installer.tar.gz WIHM-Installer
          sha256sum wihm-installer.zip wihm-installer.tar.gz wihm-update.json > SHA256SUMS
          if [ -f wihm-update.sig ]; then sha256sum wihm-update.sig >> SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: wihm-installer
          path: |
            dist/wihm-installer.zip
            dist/wihm-installer.tar.gz
            dist/SHA256SUMS
            dist/wihm-update.json
            dist/wihm-update.sig
  publish:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wihm-installer
          path: package
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#installer-v}"
          files="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # This release is the page people land on, so it also carries the apps.
          {
            printf '## دریافت\n\n'
            printf -- '- **سرور:** [نصب‌کننده](%s/wihm-installer.zip)\n' "$files"
            printf -- '- **اندروید:** [برنامهٔ اندروید](%s/wihm-messenger-android-universal.apk)\n' "$files"
            printf -- '- **ویندوز:** [برنامهٔ ویندوز](%s/wihm-messenger-windows-setup.exe)\n\n---\n\n' "$files"
            cat "docs/releases/$version.fa.md"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" package/* --repo "$GITHUB_REPOSITORY" --title "ابرانه $version" --notes-file notes.md
          sh scripts/release-apps.sh "$GITHUB_REF_NAME"
